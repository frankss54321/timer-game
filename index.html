<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計時高手挑戰 ⏱️</title>
  <style>
    :root {
      /* 頂部與底部不同色設計：頂部採用溫暖柔和的象牙米白，底部維持您喜愛的薄荷粉綠 */
      --bg-color: #d9ead1;      /* 底部：精準薄荷粉綠底色 */
      --control-bg: #f5ead2;    /* 頂部：優雅溫暖的象牙米白 */
      --text-color: #2c251e;    /* 通用文字：溫暖的深可可褐 */
      
      /* 玩家代表色（高對比、絕不混淆的粉彩調） */
      --p1-color: #1e5bb8;      /* 藍 */
      --p1-light: #dbe7f4;      /* 更鮮明的粉藍 */
      --p1-active: #cfe2ff;
      
      --p2-color: #c91e43;      /* 紅 */
      --p2-light: #fcdbe0;      /* 更鮮明的蜜桃粉 */
      --p2-active: #ffccd5;

      --p3-color: #9d7500;      /* 金 */
      --p3-light: #fff1cc;      /* 更鮮明的暖陽黃 */
      --p3-active: #fde8cd;

      --p4-color: #4c1185;      /* 紫 */
      --p4-light: #ecdcf4;      /* 更鮮明的薰衣草紫 */
      --p4-active: #e8d0ff;
      
      /* 按鈕專用色 */
      --success-color: #2b5c32;  /* 森林綠 */
      --reset-color: #a83a3f;    /* 復古紅 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 上方控制區 (奶油象牙白) */
    .control-panel {
      position: relative; /* 確保浮水印定位基準 */
      background-color: var(--control-bg);
      padding: 15px 40px;
      border-bottom: 2px solid #dfd4b8;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(44, 37, 30, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ✍️ 左上角致宇老師專屬浮水印樣式 */
    .watermark {
      position: absolute;
      top: 12px;
      left: 15px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-color);
      opacity: 0.65;
      letter-spacing: 0.5px;
      pointer-events: none; /* 防點擊干擾 */
      font-family: inherit;
    }

    /* 控制區左側/中央 */
    .control-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .control-left h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
      color: var(--text-color);
    }

    .settings-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .settings-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
    }

    .settings-group label {
      color: var(--text-color);
      font-weight: bold;
    }

    .settings-group input, .settings-group select {
      font-size: 1.1rem;
      padding: 4px 8px;
      border: 2px solid #cbd0c4;
      border-radius: 8px;
      background-color: #fcf8ee; 
      color: var(--text-color);
      text-align: center;
      font-weight: bold;
    }

    .settings-group input:focus, .settings-group select:focus {
      outline: none;
      border-color: var(--p1-color);
    }

    .settings-group input:disabled, .settings-group select:disabled {
      background-color: #e2d9c5;
      border-color: #cbd0c4;
      color: #706557;
      cursor: not-allowed;
    }

    .control-panel p {
      font-size: 0.95rem;
      color: #55483b;
      margin-bottom: 4px;
    }

    .control-right {
      width: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-left: 20px;
    }

    /* 大圓形按鈕 */
    .circular-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background-color: var(--success-color);
      color: #f2f7f2;
      font-size: 1.5rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(43, 92, 50, 0.3), 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }

    .circular-btn:hover {
      background-color: #1e3f22;
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(43, 92, 50, 0.5), 0 6px 15px rgba(0,0,0,0.15);
    }

    .circular-btn:active {
      transform: scale(0.95);
    }

    .circular-btn.reset {
      background-color: var(--reset-color);
      box-shadow: 0 0 15px rgba(168, 58, 63, 0.3), 0 4px 10px rgba(0,0,0,0.1);
    }

    .circular-btn.reset:hover {
      background-color: #842d31;
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(168, 58, 63, 0.5), 0 6px 15px rgba(0,0,0,0.15);
    }

    .hidden {
      display: none !important;
    }

    /* 垂直通道網格遊戲區 */
    .game-container {
      flex: 1;
      display: grid;
      gap: 12px;
      padding: 12px;
      position: relative;
    }

    .game-container.players-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
    .game-container.players-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
    .game-container.players-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }

    /* 玩家板塊基本樣式 */
    .player-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      cursor: not-allowed;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      overflow: hidden;
      touch-action: none; /* 多點觸控修正 */
    }

    /* 鎖定 4 個通道代表色 */
    #p1-area { background-color: #dbe7f4 !important; border: 2px solid #9ab2d4; }
    #p2-area { background-color: #fcdbe0 !important; border: 2px solid #dca2ad; }
    #p3-area { background-color: #fff1cc !important; border: 2px solid #ded0a5; }
    #p4-area { background-color: #ecdcf4 !important; border: 2px solid #caa9d6; }

    /* 懸停效果 */
    #p1-area.playable:hover { background-color: #cfe2ff !important; border-color: #799be0; }
    #p2-area.playable:hover { background-color: #ffccd5 !important; border-color: #d18797; }
    #p3-area.playable:hover { background-color: #fde8cd !important; border-color: #cbb27a; }
    #p4-area.playable:hover { background-color: #e8d0ff !important; border-color: #ab8fce; }

    /* 標題文字 */
    .player-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #p1-area .player-title { color: var(--p1-color); }
    #p2-area .player-title { color: var(--p2-color); }
    #p3-area .player-title { color: var(--p3-color); }
    #p4-area .player-title { color: var(--p4-color); }

    .status-text {
      font-size: 1.15rem;
      color: #3d523c;
      font-weight: 600;
      white-space: pre-line;
      line-height: 1.6;
    }

    /* 🔒 鎖定狀態 */
    .player-area.locked {
      filter: brightness(0.92);
      border: 3px dashed var(--text-color) !important;
    }

    .player-area.locked .status-text {
      color: #9a5f00; 
      font-size: 1.35rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    /* 結果呈現 */
    .result-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeIn 0.5s ease forwards;
    }

    .final-time {
      font-size: 2.3rem;
      font-weight: 900;
      margin-top: 5px;
      word-break: keep-all;
      color: var(--text-color);
    }

    .time-diff {
      font-size: 1.15rem;
      color: #3d523c;
      font-weight: bold;
      margin-top: 3px;
    }

    .outcome-banner {
      font-size: 1.8rem;
      font-weight: 900;
      margin-top: 15px;
      padding: 5px 15px;
      border-radius: 12px;
      letter-spacing: 2px;
      word-break: keep-all;
    }

    /* 🏆 獲勝樣式 */
    .winner {
      border: 5px solid var(--success-color) !important;
      box-shadow: 0 10px 30px rgba(43, 92, 50, 0.25), inset 0 0 60px rgba(43, 92, 50, 0.1) !important;
      transform: scale(1.04); 
      z-index: 5;
    }
    .winner .outcome-banner {
      color: var(--success-color);
      text-shadow: 0 0 10px rgba(43, 92, 50, 0.15);
      animation: bounce 0.6s infinite alternate;
    }

    /* ❌ 失敗樣式 */
    .loser {
      filter: grayscale(40%) brightness(0.95);
      transform: scale(0.96); 
    }
    .loser .player-title, .loser .status-text, .loser .result-display {
      opacity: 0.5;
    }

    /* 🎉 拉炮特效粒子 CSS 動態 */
    .confetti-particle {
      position: absolute;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 10;
      animation: confetti-fall 3.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
      25% {
        /* 向天空噴散 */
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--rot)) scale(1.2);
        opacity: 1;
      }
      100% {
        /* 緩緩旋轉飄落並消失 */
        transform: translate3d(calc(var(--x) * 1.2), calc(var(--y) + 400px), 0) rotate(calc(var(--rot) * 2.5)) scale(0);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- 上方控制面板 -->
  <div class="control-panel">
    <!-- ✍️ 左上角專屬浮水印 -->
    <div class="watermark">Designed by 致宇老師</div>

    <!-- 左側設定與資訊區 -->
    <div class="control-left">
      <h1>計時高手挑戰 ⏱️</h1>
      <div class="settings-row">
        <div class="settings-group">
          <label for="player-count-select">參賽人數：</label>
          <select id="player-count-select">
            <option value="2">2 人競賽</option>
            <option value="3">3 人競賽</option>
            <option value="4" selected>4 人競賽</option>
          </select>
        </div>
        <div class="settings-group">
          <label for="target-time-input">目標秒數 (1-60 秒)：</label>
          <input type="number" id="target-time-input" min="1" max="60" value="20">
          <span>秒</span>
        </div>
      </div>
      <p id="game-instruction">請確認參賽人數與秒數，準備好後點擊右側的「開始」按鈕！</p>
    </div>
    <div class="control-right">
      <button id="start-btn" class="circular-btn">開始</button>
      <button id="reset-btn" class="circular-btn reset hidden">重來</button>
    </div>
  </div>

  <!-- 遊戲直條網格區 -->
  <div id="game-container" class="game-container players-4">
    <!-- 玩家 1 (藍) -->
    <div id="p1-area" class="player-area">
      <div class="player-title">玩家 A (藍)</div>
      <div id="p1-status" class="status-text">等待老師啟動...</div>
      <div id="p1-result" class="result-display hidden">
        <div class="final-time" id="p1-time">00.000 秒</div>
        <div class="time-diff" id="p1-diff">誤差: 0 秒</div>
        <div class="outcome-banner" id="p1-outcome">WIN</div>
      </div>
    </div>

    <!-- 玩家 2 (紅) -->
    <div id="p2-area" class="player-area">
      <div class="player-title">玩家 B (紅)</div>
      <div id="p2-status" class="status-text">等待老師啟動...</div>
      <div id="p2-result" class="result-display hidden">
        <div class="final-time" id="p2-time">00.000 秒</div>
        <div class="time-diff" id="p2-diff">誤差: 0 秒</div>
        <div class="outcome-banner" id="p2-outcome">WIN</div>
      </div>
    </div>

    <!-- 玩家 3 (金) -->
    <div id="p3-area" class="player-area">
      <div class="player-title">玩家 C (金)</div>
      <div id="p3-status" class="status-text">等待老師啟動...</div>
      <div id="p3-result" class="result-display hidden">
        <div class="final-time" id="p3-time">00.000 秒</div>
        <div class="time-diff" id="p3-diff">誤差: 0 秒</div>
        <div class="outcome-banner" id="p3-outcome">WIN</div>
      </div>
    </div>

    <!-- 玩家 4 (紫) -->
    <div id="p4-area" class="player-area">
      <div class="player-title">玩家 D (紫)</div>
      <div id="p4-status" class="status-text">等待老師啟動...</div>
      <div id="p4-result" class="result-display hidden">
        <div class="final-time" id="p4-time">00.000 秒</div>
        <div class="time-diff" id="p4-diff">誤差: 0 秒</div>
        <div class="outcome-banner" id="p4-outcome">WIN</div>
      </div>
    </div>
  </div>

  <script>
    // --- 高級、無節拍環境聲音管理器 (Web Audio API) ---
    const AudioManager = {
      ctx: null,
      bgmInterval: null,
      bgmStep: 0,
      
      // 亮麗跳躍的五聲和弦音 (C4, E4, G4, A4, C5)
      melody: [261.63, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63], 
      // 輕鬆活潑的和弦低音律動 (C3, G3, F3)
      bass: [130.81, 0, 196.00, 0, 174.61, 0, 196.00, 0], 

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playStartSFX() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.15);
        
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
        
        osc.start(now);
        osc.stop(now + 0.15);
      },

      playTapSFX() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(261.63, now); 
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
        
        osc.start(now);
        osc.stop(now + 0.1);
      },

      playWinnerSFX() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [261.63, 329.63, 392.00, 493.88]; 
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.08, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.6);
          
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.6);
        });
      },

      // BGM：大音量、輕快活潑的「環境木琴（Bouncy Marimba）八音盒」旋律
      startBGM() {
        this.init();
        this.stopBGM(); 
        this.bgmStep = 0;

        // 120 BPM 的八分音符律動 (每步 250ms)
        this.bgmInterval = setInterval(() => {
          this.playBgmStep();
        }, 250);
      },

      playBgmStep() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 1. 播放主旋律（音量放大 4 倍）
        const mFreq = this.melody[this.bgmStep];
        const oscMelody = this.ctx.createOscillator();
        const gainMelody = this.ctx.createGain();
        oscMelody.connect(gainMelody);
        gainMelody.connect(this.ctx.destination);
        
        oscMelody.type = 'triangle'; 
        oscMelody.frequency.setValueAtTime(mFreq, now);
        
        gainMelody.gain.setValueAtTime(0, now);
        gainMelody.gain.linearRampToValueAtTime(0.12, now + 0.01); // 放大音量
        gainMelody.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        
        oscMelody.start(now);
        oscMelody.stop(now + 0.2);

        // 2. 播放溫柔低頻伴奏（音量同步放大）
        const bFreq = this.bass[this.bgmStep];
        if (bFreq > 0) {
          const oscBass = this.ctx.createOscillator();
          const gainBass = this.ctx.createGain();
          oscBass.connect(gainBass);
          gainBass.connect(this.ctx.destination);
          
          oscBass.type = 'sine';
          oscBass.frequency.setValueAtTime(bFreq, now);
          
          gainBass.gain.setValueAtTime(0, now);
          gainBass.gain.linearRampToValueAtTime(0.18, now + 0.03); // 放大音量
          gainBass.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          
          oscBass.start(now);
          oscBass.stop(now + 0.45);
        }

        this.bgmStep = (this.bgmStep + 1) % 8;
      },

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }
    };

    // --- 🎉 拉炮粒子物理效果生成器 ---
    function spawnConfetti(parent) {
      const numParticles = 65;
      const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7', '#00f5d4', '#fee440', '#00bbf9'];
      
      for (let i = 0; i < numParticles; i++) {
        const particle = document.createElement('div');
        particle.className = 'confetti-particle';
        
        // 隨機角度與推力 (朝著天空中偏兩側拋射)
        const angle = (Math.random() * 100 + 40) * Math.PI / 180; // 40~140 度
        const velocity = Math.random() * 260 + 180; // 拋射力度
        
        const x = Math.cos(angle) * velocity;
        const y = -Math.sin(angle) * velocity; // 向上為負值
        const rotation = Math.random() * 360;
        
        particle.style.setProperty('--x', `${x}px`);
        particle.style.setProperty('--y', `${y}px`);
        particle.style.setProperty('--rot', `${rotation}deg`);
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // 隨機落點與起始高度 (集中在下半部出發)
        particle.style.left = `${Math.random() * 50 + 25}%`; // 25% ~ 75% 寬度間出發
        particle.style.bottom = `${Math.random() * 15 + 10}%`; // 離底部 10%~25%
        
        // 增加微小的延遲，讓噴射感覺更立體、不僵硬
        particle.style.animationDelay = `${Math.random() * 0.25}s`;
        
        parent.appendChild(particle);
        
        // 自動移除，節省記憶體
        setTimeout(() => {
          particle.remove();
        }, 3400);
      }
    }

    // --- 遊戲邏輯變數 ---
    let gameState = 'idle'; 
    let targetTime = 20.0;
    let startTime = null;
    
    let activePlayers = [true, true, true, true]; 
    let clickedPlayers = [false, false, false, false]; 
    let playerTimes = [0, 0, 0, 0]; 

    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const targetInput = document.getElementById('target-time-input');
    const countSelect = document.getElementById('player-count-select');
    const gameContainer = document.getElementById('game-container');
    const instruction = document.getElementById('game-instruction');

    countSelect.addEventListener('change', () => {
      const count = parseInt(countSelect.value);
      updatePlayerLayout(count);
    });

    function updatePlayerLayout(count) {
      gameContainer.className = `game-container players-${count}`;
      for (let i = 1; i <= 4; i++) {
        const area = document.getElementById(`p${i}-area`);
        if (i <= count) {
          area.classList.remove('hidden');
        } else {
          area.classList.add('hidden');
        }
      }
    }

    startBtn.addEventListener('click', () => {
      if (gameState !== 'idle') return;

      AudioManager.playStartSFX();
      AudioManager.startBGM();

      let inputVal = parseFloat(targetInput.value);
      if (isNaN(inputVal) || inputVal < 1) {
        inputVal = 1;
      } else if (inputVal > 60) {
        inputVal = 60;
      }
      targetTime = inputVal;
      targetInput.value = targetTime;

      const count = parseInt(countSelect.value);
      activePlayers = [
        true,          
        true,          
        count >= 3,    
        count === 4    
      ];
      clickedPlayers = [false, false, false, false];
      playerTimes = [0, 0, 0, 0];

      gameState = 'playing';
      startTime = performance.now();

      targetInput.disabled = true;
      countSelect.disabled = true;
      startBtn.classList.add('hidden');

      instruction.innerHTML = `挑戰開始！請默數 <span style="color: var(--success-color); font-size: 1.15rem; font-weight: bold;">${targetTime}</span> 秒，自認時間到時，點擊你代表的顏色直條！`;

      for (let i = 0; i < 4; i++) {
        if (activePlayers[i]) {
          const area = document.getElementById(`p${i+1}-area`);
          area.classList.add('playable');
          document.getElementById(`p${i+1}-status`).innerText = "「點擊此直條鎖定時間」";
        }
      }
    });

    // 指標按下事件（完美支援多點觸控） [2]
    for (let i = 1; i <= 4; i++) {
      const area = document.getElementById(`p${i}-area`);
      area.addEventListener('pointerdown', (e) => {
        const index = i - 1;
        if (gameState !== 'playing' || !activePlayers[index] || clickedPlayers[index]) return;

        // 阻止多指觸摸時的預設手勢動作
        e.preventDefault();

        AudioManager.playTapSFX();

        playerTimes[index] = (performance.now() - startTime) / 1000;
        clickedPlayers[index] = true;

        area.classList.remove('playable');
        area.classList.add('locked');
        document.getElementById(`p${i}-status`).innerText = "🔒 已鎖定！\n(等候其他玩家...)";

        checkGameFinished();
      });
    }

    function checkGameFinished() {
      const finished = activePlayers.every((active, index) => !active || clickedPlayers[index]);
      if (finished) {
        gameState = 'finished';
        revealResults();
      }
    }

    function revealResults() {
      AudioManager.stopBGM();
      AudioManager.playWinnerSFX();

      const diffs = playerTimes.map((time, index) => {
        if (!activePlayers[index]) return Infinity; 
        return Math.abs(targetTime - time);
      });

      const minDiff = Math.min(...diffs);

      for (let i = 0; i < 4; i++) {
        if (!activePlayers[i]) continue;

        const playerNum = i + 1;
        const time = playerTimes[i];
        const diff = time - targetTime;
        const absDiff = Math.abs(diff);

        const area = document.getElementById(`p${playerNum}-area`);
        area.classList.remove('locked', 'playable');

        document.getElementById(`p${playerNum}-status`).classList.add('hidden');
        const resultDiv = document.getElementById(`p${playerNum}-result`);
        resultDiv.classList.remove('hidden');

        document.getElementById(`p${playerNum}-time`).innerText = `${time.toFixed(3)} 秒`;

        const sign = diff >= 0 ? '+' : '';
        document.getElementById(`p${playerNum}-diff`).innerText = `誤差: ${sign}${diff.toFixed(3)} 秒`;

        const outcome = document.getElementById(`p${playerNum}-outcome`);

        if (Math.abs(absDiff - minDiff) < 0.0001) {
          outcome.innerText = "🏆 勝利";
          area.classList.add('winner');
          // 🏆 觸發專屬獲勝直條的拉炮物理特效
          spawnConfetti(area);
        } else {
          outcome.innerText = "❌ 失敗";
          area.classList.add('loser');
        }
      }

      instruction.innerText = `挑戰結束！誰是時間掌控大師？`;
      resetBtn.classList.remove('hidden');
    }

    resetBtn.addEventListener('click', () => {
      AudioManager.playStartSFX();

      gameState = 'idle';
      startTime = null;
      
      const currentCount = parseInt(countSelect.value);
      activePlayers = [
        true,
        true,
        currentCount >= 3,
        currentCount === 4
      ];
      clickedPlayers = [false, false, false, false];
      playerTimes = [0, 0, 0, 0];

      targetInput.disabled = false;
      countSelect.disabled = false;

      instruction.innerText = "請確認參賽人數與秒數，準備好後點擊右側的「開始」按鈕！";
      startBtn.classList.remove('hidden');
      resetBtn.classList.add('hidden');

      // 重設所有玩家面板
      for (let i = 1; i <= 4; i++) {
        const area = document.getElementById(`p${i}-area`);
        area.className = 'player-area'; 
        
        // 清除任何殘留的拉炮粒子
        const remainingParticles = area.querySelectorAll('.confetti-particle');
        remainingParticles.forEach(p => p.remove());

        if (i <= currentCount) {
          area.classList.remove('hidden');
        } else {
          area.classList.add('hidden');
        }

        const status = document.getElementById(`p${i}-status`);
        status.innerText = "等待老師啟動...";
        status.classList.remove('hidden');

        document.getElementById(`p${i}-result`).classList.add('hidden');
      }
    });
  </script>
</body>
</html>
